<!doctype html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/images/icon.ico"
      type="image/x-icon"
    />
    <title>CTU Scheduler — Tối Ưu Thời Khóa Biểu Đại Học Cần Thơ</title>
    <meta
      name="description"
      content="Ứng dụng Desktop tự động hóa xếp lịch học, giải quyết xung đột môn và theo dõi biến động sĩ số trực tiếp từ MyCTU cho sinh viên Đại học Cần Thơ."
    />

    <!-- Google Fonts: Playfair Display (Serif) & Inter (Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome for technical asset & platform icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <style>
      h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 4rem; line-height: 1.1; font-weight: 500; letter-spacing: 0.01em; }
      h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 2.5rem; line-height: 1.2; font-weight: 500; letter-spacing: 0.01em; }
      h3 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.75rem; line-height: 1.3; font-weight: 500; letter-spacing: 0.01em; }
      h4 { font-family: 'Inter', sans-serif; font-size: 1.125rem; line-height: 1.4; font-weight: 600; }
      body { font-family: 'Inter', sans-serif; font-size: 1rem; line-height: 1.6; }
    </style>
  </head>
  <body class="bg-[#08080a] text-[#e2e3e9] min-h-screen flex flex-col antialiased selection:bg-[#cc9166] selection:text-[#08080a]">
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
