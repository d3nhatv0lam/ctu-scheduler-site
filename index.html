<!doctype html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/images/icon.ico"
      type="image/x-icon"
    />
    <title>CTU Scheduler — Tối Ưu Thời Khóa Biểu Đại Học Cần Thơ</title>
    <meta
      name="description"
      content="Bảng điều khiển xếp thời khóa biểu thông minh, tự động hóa tổ hợp môn và kiểm tra biến động sĩ số trực tiếp từ MyCTU cho sinh viên Đại học Cần Thơ."
    />

    <!-- Google Fonts: Plus Jakarta Sans, Inter (No Monospace) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome for technical icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"

    <link rel="stylesheet" href="./css/style.css" />
    <style>
      h1 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 3.75rem; line-height: 1.1; font-weight: 800; letter-spacing: -0.04em; }

      h3 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 1.75rem; line-height: 1.25; font-weight: 700; letter-spacing: -0.03em; }
      h4 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 1.125rem; line-height: 1.4; font-weight: 650; letter-spacing: -0.02em; }
      body { font-family: 'Inter', system-ui, sans-serif; font-size: 1rem; line-height: 1.5; }

  </head>
  <body class="bg-[#ffffff] text-[#202020] min-h-screen flex flex-col antialiased selection:bg-[#6647f0] selection:text-[#ffffff]">
    <div id="app"></div>
